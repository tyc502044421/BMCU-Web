<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMCU WebHome</title>
<style>
  :root{--bg:#f5f6f8;--surface:#fff;--ink:#111418;--muted:#667085;--line:#e4e7ec;--accent:#0ea5b7;--radius:12px;--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18)}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;line-height:1.6}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px}
  header{padding:32px 0 16px} header h1{margin:0;font-size:26px} header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))} @media(max-width:700px){.grid{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
  .card h2{margin:0 0 6px;font-size:18px} .card p{margin:0;color:var(--muted);font-size:14px}
  .card a{display:inline-block;margin-top:12px;padding:10px 16px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-size:14px}
  .card a.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
  footer{margin:24px 0 30px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BMCU WebHome</h1>
    <p>固件 11.1.0-TYC.1 · 参数模式 · 在线刷写与设置指南</p>
  </header>
  <div class="grid">
    <div class="card">
      <h2>在线刷写</h2>
      <p>通过浏览器直接刷写固件，无需安装 Python。支持 Chrome/Edge 的 Web Serial。</p>
      <a href="flasher.html">进入刷写页</a>
      <a href="https://github.com/tyc502044421/BMCU-TYC/releases" class="secondary" style="margin-left:8px">GitHub Releases</a>
    </div>
    <div class="card">
      <h2>设置指南</h2>
      <p>参数模式、标定、清除与排错的完整说明。</p>
      <a href="guide.html">查看指南</a>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h2 style="margin:0 0 6px;font-size:16px">固件</h2>
    <p style="margin:0;color:var(--muted);font-size:14px">当前版本 11.1.0-TYC.1（基于 11.00.00.00）。刷写后需重做标定向导。</p>
    <p style="margin:8px 0 0;font-size:13px"><a href="firmware/">浏览 firmware/ 目录</a> · <a href="https://github.com/tyc502044421/BMCU-TYC">私有仓</a></p>
  </div>
  <footer>本目录可直接用 <code>python -m http.server</code> 或 GitHub Pages 发布</footer>
</div>
</body>
</html>
